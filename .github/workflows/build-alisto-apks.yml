name: Build & Publish Alisto Native Android Kotlin APKs

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "*.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Assemble Alisto Customer APK & Alisto Contractor APK
        working-directory: ./android-alisto
        run: |
          gradle :app-customer:assembleDebug :app-contractor:assembleDebug --no-daemon

      - name: Publish Compiled APKs to Repository Root & Artifacts
        run: |
          mkdir -p dist-apks
          cp android-alisto/app-customer/build/outputs/apk/debug/app-customer-debug.apk alisto-customer.apk
          cp android-alisto/app-contractor/build/outputs/apk/debug/app-contractor-debug.apk alisto-contractor.apk
          cp alisto-customer.apk dist-apks/alisto-customer.apk
          cp alisto-contractor.apk dist-apks/alisto-contractor.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alisto-customer.apk alisto-contractor.apk
          git diff --staged --quiet || git commit -m "Auto-publish compiled Native Kotlin APKs (alisto-customer.apk & alisto-contractor.apk)"
          git push origin HEAD:main

      - name: Upload Native Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alisto-native-android-apks
          path: dist-apks/*.apk
