    if (bootStyle) bootStyle.remove();
    if (payload.bodyClass) document.body.className = payload.bodyClass;
    document.body.innerHTML = payload.bodyHtml || "";

    // 4. Execute vaulted app.js in global scope & fire any DOMContentLoaded/load hooks
    var pendingDom = [];
    var pendingLoad = [];
    var origDocAdd = document.addEventListener.bind(document);
    var origWinAdd = window.addEventListener.bind(window);
    var alreadyReady = document.readyState !== "loading";

    if (alreadyReady) {
      document.addEventListener = function (type, fn, opts) {
        if (type === "DOMContentLoaded" && typeof fn === "function") {
          pendingDom.push(fn);
          return;
        }
        return origDocAdd(type, fn, opts);
      };
      window.addEventListener = function (type, fn, opts) {
        if ((type === "DOMContentLoaded" || type === "load") && typeof fn === "function") {
          pendingLoad.push(fn);
          return;
        }
        return origWinAdd(type, fn, opts);
      };
    }

    try {
      var appScript = document.createElement("script");
      appScript.textContent = payload.js || "";
      document.body.appendChild(appScript);
    } finally {
      if (alreadyReady) {
        document.addEventListener = origDocAdd;
        window.addEventListener = origWinAdd;
      }
    }

    pendingDom.forEach(function (fn) {
      try { fn(new Event("DOMContentLoaded")); } catch (err) { console.error(err); }
    });
    pendingLoad.forEach(function (fn) {
      try { fn(new Event("load")); } catch (err) { console.error(err); }
    });
  } catch (err) {
    console.error("Ops portal boot error:", err);
    showBootError(err && err.message ? err.message : String(err));
  }
})();
  </script>
